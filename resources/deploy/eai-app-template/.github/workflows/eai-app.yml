name: EAI App Deployment Handoff
run-name: EAI deploy ${{ inputs.app_key }} (${{ inputs.operation_id }})

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Approved source authority for this deployment.
        required: false
        type: choice
        options:
          - source-unknown
          - eai-cli-generated
        default: source-unknown
      app_key:
        description: EAI app key to bind.
        required: true
      tenant_id:
        description: Company tenant ID that owns the app enrollment.
        required: true
      target_tenant_id:
        description: Signed hosting tenant bound to the CLI managed-source operation.
        required: false
      operation_id:
        description: Operation ID from eai app workflow-setup.
        required: true
      nonce:
        description: One-time nonce from eai app workflow-setup.
        required: true
      config_hash:
        description: Exact configuration hash approved by workflow setup.
        required: true
      commit_sha:
        description: Exact source commit approved by workflow setup.
        required: true
      public_api_url:
        description: Trusted EAI regional PublicAPI URL, or the sealed local DEV tunnel for this operation.
        required: false
      local_e2e_tunnel:
        description: Explicit direct-dispatch DEV/preview tunnel mode; default off.
        required: false
        type: boolean
        default: false
      local_e2e_expires_at:
        description: Exact server-issued local dispatch expiry.
        required: false
      publicapi_base_url:
        description: Deprecated alias for public_api_url; retained for compatibility.
        required: false
      env:
        description: Deployment environment to bind; preferred input name.
        required: false
      environment:
        description: Deployment environment to bind; compatibility alias for env.
        required: false
      release_channel:
        description: Deprecated compatibility input; deployment environment is authoritative.
        required: false
  # Reusable compatibility is limited to a workflow_dispatch caller in this
  # repository at the same ref. PublicAPI verifies the signed caller
  # workflow_ref and canonical callee job_workflow_ref/job_workflow_sha.
  # The caller must grant contents/packages/actions read plus attestations and
  # id-token write; this workflow cannot elevate caller permissions.
  workflow_call:
    inputs:
      source_mode:
        description: Approved source authority for this deployment.
        required: false
        type: string
        default: source-unknown
      app_key:
        required: true
        type: string
      tenant_id:
        required: true
        type: string
      target_tenant_id:
        required: false
        type: string
      operation_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
      config_hash:
        description: Exact configuration hash approved by workflow setup.
        required: false
        type: string
      commit_sha:
        description: Exact source commit; defaults to the reusable workflow caller SHA.
        required: false
        type: string
      eai_reusable_call:
        description: Internal compatibility marker; keep the default value.
        required: false
        type: boolean
        default: true
      public_api_url:
        required: false
        type: string
      publicapi_base_url:
        description: Deprecated alias for public_api_url.
        required: false
        type: string
      env:
        required: false
        type: string
      environment:
        description: Compatibility alias for env.
        required: false
        type: string
      release_channel:
        description: Deprecated compatibility input; accepted but not authoritative.
        required: false
        type: string
    secrets:
      EAI_ACCESS_TOKEN:
        description: Deprecated and intentionally unused.
        required: false
      EAI_PUBLIC_API_URL:
        description: Deprecated and intentionally unused; bind the endpoint with a workflow input.
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: eai-app-${{ inputs.source_mode }}-${{ inputs.app_key }}-${{ inputs.env || inputs.environment || 'preview' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  EAI_WORKFLOW_PATH: .github/workflows/eai-app.yml

jobs:
  build:
    outputs:
      deployment_environment: ${{ steps.dispatch-binding.outputs.deployment_environment }}
      github_environment: ${{ steps.dispatch-binding.outputs.github_environment }}
      config_hash: ${{ steps.deployment-binding.outputs.config_hash }}
      source_commit_sha: ${{ steps.invocation.outputs.source_commit_sha }}
      image_artifact_id: ${{ steps.image-artifact.outputs.artifact-id }}
      image_artifact_digest: ${{ steps.image-artifact.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow invocation
        id: invocation
        env:
          EAI_CALLER_EVENT_NAME: ${{ github.event_name }}
          EAI_REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          EAI_REUSABLE_CALL: ${{ inputs.eai_reusable_call }}
          EAI_CALLER_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EAI_CALLER_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Managed deployment requires a manually dispatched caller." >&2
            exit 1
          fi
          source_commit_sha="$EAI_REQUESTED_COMMIT_SHA"
          if [[ -z "$source_commit_sha" && "$EAI_REUSABLE_CALL" == "true" ]]; then
            source_commit_sha="$EAI_CALLER_COMMIT_SHA"
          fi
          if [[ ! "$source_commit_sha" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Managed deployment requires an exact lowercase source commit SHA before checkout." >&2
            exit 1
          fi
          if [[ "$source_commit_sha" != "$EAI_CALLER_COMMIT_SHA" ]]; then
            echo "Managed deployment source commit must match the signed workflow event SHA." >&2
            exit 1
          fi
          printf 'source_commit_sha=%s\n' "$source_commit_sha" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve immutable configuration hash
        id: deployment-binding
        env:
          REQUESTED_CONFIG_HASH: ${{ inputs.config_hash }}
          EAI_REUSABLE_CALL: ${{ inputs.eai_reusable_call }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$REQUESTED_CONFIG_HASH" && "$EAI_REUSABLE_CALL" != "true" ]]; then
            echo "Direct managed deployment requires its server-approved config_hash." >&2
            exit 1
          fi
          config_hash="$(node scripts/source-unknown-deployment-evidence.mjs config-hash)"
          [[ "$config_hash" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [[ -n "$REQUESTED_CONFIG_HASH" && "$REQUESTED_CONFIG_HASH" != "$config_hash" ]]; then
            echo "Supplied config_hash does not match the exact checked-out runtime configuration." >&2
            exit 1
          fi
          printf 'config_hash=%s\n' "$config_hash" >> "$GITHUB_OUTPUT"

      - name: Validate immutable dispatch and trusted endpoint
        id: dispatch-binding
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_TENANT_ID: ${{ inputs.target_tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          NONCE: ${{ inputs.nonce }}
          CONFIG_HASH: ${{ steps.deployment-binding.outputs.config_hash }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env || inputs.environment || 'preview' }}
          LEGACY_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PREFERRED_DEPLOY_ENVIRONMENT: ${{ inputs.env }}
          EAI_BOUND_PUBLIC_API_URL: ${{ inputs.public_api_url || inputs.publicapi_base_url }}
          LEGACY_PUBLIC_API_URL: ${{ inputs.publicapi_base_url }}
          PREFERRED_PUBLIC_API_URL: ${{ inputs.public_api_url }}
          SOURCE_COMMIT_SHA: ${{ steps.invocation.outputs.source_commit_sha }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
          LOCAL_E2E_TUNNEL: ${{ inputs.local_e2e_tunnel }}
          LOCAL_E2E_EXPIRES_AT: ${{ inputs.local_e2e_expires_at }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSABLE_CALL: ${{ inputs.eai_reusable_call }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          node scripts/source-unknown-deployment-evidence.mjs validate-dispatch \
            --source-mode "$SOURCE_MODE" \
            --app-key "$APP_KEY" \
            --tenant-id "$TENANT_ID" \
            --target-tenant-id "$TARGET_TENANT_ID" \
            --operation-id "$OPERATION_ID" \
            --nonce "$NONCE" \
            --ref "$GITHUB_REF" \
            --expected-config-hash "$CONFIG_HASH" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --preferred-environment "$PREFERRED_DEPLOY_ENVIRONMENT" \
            --legacy-environment "$LEGACY_DEPLOY_ENVIRONMENT" \
            --public-api-url "$EAI_BOUND_PUBLIC_API_URL" \
            --preferred-public-api-url "$PREFERRED_PUBLIC_API_URL" \
            --legacy-public-api-url "$LEGACY_PUBLIC_API_URL" \
            --local-e2e-tunnel "$LOCAL_E2E_TUNNEL" \
            --local-e2e-expires-at "$LOCAL_E2E_EXPIRES_AT" \
            --github-event-name "$GITHUB_EVENT_NAME" \
            --reusable-call "$REUSABLE_CALL" \
            --repository-id "$REPOSITORY_ID" \
            --commit "$SOURCE_COMMIT_SHA" \
            --workflow-sha "$GITHUB_SHA"

      - name: Install dependencies without running application-controlled scripts
        run: npm ci --ignore-scripts

      - name: Run dependency install scripts without package credentials
        run: npm rebuild

      - name: Install Linux native CSS bindings
        run: npm install --no-save --package-lock=false lightningcss-linux-x64-gnu@1.30.2 @tailwindcss/oxide-linux-x64-gnu@4.1.18

      - name: Build deterministic Object Type outputs
        env:
          EAI_APP_KEY: ${{ inputs.app_key }}
          EAI_TENANT_ID: ${{ inputs.tenant_id }}
        run: npm run build:object-types

      - name: Validate application
        env:
          EAI_APP_KEY: ${{ inputs.app_key }}
          EAI_TENANT_ID: ${{ inputs.tenant_id }}
        shell: bash
        run: |
          set -uo pipefail
          npm run typecheck &
          typecheck_pid=$!
          npm run test:unit:ci &
          tests_pid=$!
          validation_status=0
          wait "$typecheck_pid" || validation_status=1
          wait "$tests_pid" || validation_status=1
          exit "$validation_status"

      - name: Build generated app
        env:
          EAI_APP_KEY: ${{ inputs.app_key }}
          EAI_TENANT_ID: ${{ inputs.tenant_id }}
        run: npm run build

      - name: Prepare image context
        run: node scripts/source-unknown-deployment-evidence.mjs prepare-image-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build OCI image archive
        id: built-image
        env:
          IMAGE_STAGING_ROOT: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file .eai-build/image-context/Dockerfile \
            --output type=oci,dest=- \
            .eai-build/image-context \
            | node scripts/source-unknown-deployment-evidence.mjs write-image-archive \
                --staging-root "$IMAGE_STAGING_ROOT" \
                --github-output "$GITHUB_OUTPUT"

      - name: Verify post-build source integrity
        env:
          SOURCE_COMMIT_SHA: ${{ steps.invocation.outputs.source_commit_sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          git diff --exit-code -- . \
            ':(exclude)src/eai.config/object-types.json' \
            ':(exclude)src/eai.config/object-types.provisioning.json'
          untracked="$(git status --porcelain=v1 --untracked-files=all -- . \
            ':(exclude).eai-build/**' \
            ':(exclude)src/eai.config/object-types.json' \
            ':(exclude)src/eai.config/object-types.provisioning.json')"
          test -z "$untracked" || { printf '%s\n' "$untracked"; exit 1; }

      - name: Upload immutable image artifact
        id: image-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eai-generated-app-image
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: ${{ steps.built-image.outputs.image_archive_path }}

      - name: Collect immutable build evidence
        id: evidence
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_TENANT_ID: ${{ inputs.target_tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          NONCE: ${{ inputs.nonce }}
          CONFIG_HASH: ${{ steps.deployment-binding.outputs.config_hash }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env || inputs.environment || 'preview' }}
          LEGACY_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PREFERRED_DEPLOY_ENVIRONMENT: ${{ inputs.env }}
          SOURCE_COMMIT_SHA: ${{ steps.invocation.outputs.source_commit_sha }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
          EAI_BOUND_PUBLIC_API_URL: ${{ inputs.public_api_url || inputs.publicapi_base_url }}
          LOCAL_E2E_TUNNEL: ${{ inputs.local_e2e_tunnel }}
          LOCAL_E2E_EXPIRES_AT: ${{ inputs.local_e2e_expires_at }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSABLE_CALL: ${{ inputs.eai_reusable_call }}
          REPOSITORY_ID: ${{ github.repository_id }}
          STAGED_IMAGE_ARCHIVE: ${{ steps.built-image.outputs.image_archive_path }}
          STAGED_ARCHIVE_DIGEST: ${{ steps.built-image.outputs.archive_digest }}
          IMAGE_DIGEST: ${{ steps.built-image.outputs.image_digest }}
          IMAGE_STAGING_ROOT: ${{ runner.temp }}
        run: |
          node scripts/source-unknown-deployment-evidence.mjs collect \
            --source-mode "$SOURCE_MODE" \
            --public-api-url "$EAI_BOUND_PUBLIC_API_URL" \
            --local-e2e-tunnel "$LOCAL_E2E_TUNNEL" \
            --local-e2e-expires-at "$LOCAL_E2E_EXPIRES_AT" \
            --github-event-name "$GITHUB_EVENT_NAME" \
            --reusable-call "$REUSABLE_CALL" \
            --repository-id "$REPOSITORY_ID" \
            --target-tenant-id "$TARGET_TENANT_ID" \
            --app-key "$APP_KEY" \
            --tenant-id "$TENANT_ID" \
            --operation-id "$OPERATION_ID" \
            --nonce "$NONCE" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$EAI_WORKFLOW_PATH" \
            --ref "$GITHUB_REF" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$SOURCE_COMMIT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --preferred-environment "$PREFERRED_DEPLOY_ENVIRONMENT" \
            --legacy-environment "$LEGACY_DEPLOY_ENVIRONMENT" \
            --expected-config-hash "$CONFIG_HASH" \
            --image-archive "$STAGED_IMAGE_ARCHIVE" \
            --image-staging-root "$IMAGE_STAGING_ROOT" \
            --expected-archive-digest "$STAGED_ARCHIVE_DIGEST" \
            --artifact-id "${{ steps.image-artifact.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.image-artifact.outputs.artifact-digest }}" \
            --image-digest "$IMAGE_DIGEST"

      - name: Upload immutable build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eai-generated-app-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .eai-build/evidence/source-unknown-deployment-evidence.json

  handoff:
    needs: build
    environment:
      name: ${{ needs.build.outputs.github_environment }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Download immutable image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eai-generated-app-image
          path: .eai-build

      - name: Download immutable build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eai-generated-app-evidence
          path: .eai-build/evidence

      - name: Validate exact handoff binding
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_TENANT_ID: ${{ inputs.target_tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          NONCE: ${{ inputs.nonce }}
          CONFIG_HASH: ${{ needs.build.outputs.config_hash }}
          DEPLOY_ENVIRONMENT: ${{ needs.build.outputs.deployment_environment }}
          EAI_BOUND_PUBLIC_API_URL: ${{ inputs.public_api_url || inputs.publicapi_base_url }}
          SOURCE_COMMIT_SHA: ${{ needs.build.outputs.source_commit_sha }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
          LOCAL_E2E_TUNNEL: ${{ inputs.local_e2e_tunnel }}
          LOCAL_E2E_EXPIRES_AT: ${{ inputs.local_e2e_expires_at }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          REUSABLE_CALL: ${{ inputs.eai_reusable_call }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          BUILD_IMAGE_ARTIFACT_ID: ${{ needs.build.outputs.image_artifact_id }}
          BUILD_IMAGE_ARTIFACT_DIGEST: ${{ needs.build.outputs.image_artifact_digest }}
        shell: bash
        run: |
          if [[ "$LOCAL_E2E_TUNNEL" == true ]]; then
            [[ ( "$SOURCE_MODE" == eai-cli-generated || "$SOURCE_MODE" == source-unknown ) && "$GITHUB_EVENT_NAME" == workflow_dispatch && "$REUSABLE_CALL" != true ]]
            [[ "$DEPLOY_ENVIRONMENT" == dev || "$DEPLOY_ENVIRONMENT" == preview ]]
            [[ "$EAI_BOUND_PUBLIC_API_URL" =~ ^https://[a-z0-9-]+-8000\.[a-z0-9-]+\.devtunnels\.ms$ ]]
          else
            [[ "$LOCAL_E2E_TUNNEL" == false || -z "$LOCAL_E2E_TUNNEL" ]]
            [[ -z "$LOCAL_E2E_EXPIRES_AT" ]]
            [[ "$EAI_BOUND_PUBLIC_API_URL" =~ ^https://(dev-api\.au|(test-api|api)\.(au|ca|eu))\.myenterprise\.ai/public/?$ ]]
          fi
          [[ "$APP_KEY" =~ ^[a-z][a-z0-9-]{1,62}$ ]]
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._:-]{0,254}[A-Za-z0-9])?$ ]]
          if [[ "$SOURCE_MODE" == "eai-cli-generated" || -n "$TARGET_TENANT_ID" ]]; then
            [[ "$TARGET_TENANT_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._:-]{0,254}[A-Za-z0-9])?$ ]]
          fi
          [[ "$OPERATION_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._~:-]{0,254}[A-Za-z0-9])?$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONFIG_HASH" =~ ^sha256:[a-f0-9]{64}$ ]]
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const { isDeepStrictEqual } = require('node:util');
          const MAX_IMAGE_ARCHIVE_BYTES = 10 * 1024 * 1024 * 1024;
          const MAX_GOVERNED_CONFIG_FILE_BYTES = 10 * 1024 * 1024;
          const MAX_GOVERNED_CONFIG_TOTAL_BYTES = 32 * 1024 * 1024;
          const MAX_GOVERNED_CONFIG_FILES = 4096;
          const MAX_BUILD_EVIDENCE_BYTES = 1024 * 1024;
          const MAX_PRODUCER_SOURCE_BYTES = 1024 * 1024;
          const MAX_GITHUB_METADATA_RESPONSE_BYTES = 1024 * 1024;
          const MAX_GITHUB_TREE_RESPONSE_BYTES = 16 * 1024 * 1024;
          const MAX_GITHUB_BLOB_RESPONSE_BYTES = 16 * 1024 * 1024;
          const MAX_OCI_LAYOUT_BYTES = 1024;
          const MAX_OCI_INDEX_BYTES = 1024 * 1024;
          const MAX_OCI_MANIFEST_BYTES = 4 * 1024 * 1024;
          const MAX_OCI_CONFIG_BYTES = 4 * 1024 * 1024;
          const MAX_OCI_LAYER_COUNT = 1024;
          const MAX_TAR_LISTING_BYTES = 64 * 1024;
          const MAX_OCI_BLOB_PATH_BYTES = Buffer.byteLength('blobs/sha256/') + 64;
          const MAX_OCI_BLOB_MEMBER_RECORD_BYTES = MAX_OCI_BLOB_PATH_BYTES + 1;
          const MAX_OCI_BLOB_VERIFIED_RECORD_BYTES = Buffer.byteLength('verified:') + MAX_OCI_BLOB_PATH_BYTES + 1;
          const MAX_OCI_BLOB_VALIDATION_OUTPUT_BYTES = (MAX_OCI_LAYER_COUNT + 1) * (MAX_OCI_BLOB_MEMBER_RECORD_BYTES + MAX_OCI_BLOB_VERIFIED_RECORD_BYTES);
          const MAX_OCI_EXPECTED_BLOB_TABLE_BYTES = 112 * 1024;
          const TAR_TIMEOUT_MS = 10 * 60 * 1000;
          const SHA256_DIGEST = /^sha256:[a-f0-9]{64}$/;
          const OCI_MANIFEST_MEDIA_TYPES = new Set([
            'application/vnd.oci.image.manifest.v1+json',
            'application/vnd.docker.distribution.manifest.v2+json',
          ]);
          const OCI_CONFIG_MEDIA_TYPES = new Set([
            'application/vnd.oci.image.config.v1+json',
          ]);
          const DOCKER_CONFIG_MEDIA_TYPES = new Set([
            'application/vnd.docker.container.image.v1+json',
          ]);
          const OCI_LAYER_MEDIA_TYPES = new Set([
            'application/vnd.oci.image.layer.v1.tar',
            'application/vnd.oci.image.layer.v1.tar+gzip',
            'application/vnd.oci.image.layer.v1.tar+zstd',
            'application/vnd.oci.image.layer.nondistributable.v1.tar',
            'application/vnd.oci.image.layer.nondistributable.v1.tar+gzip',
            'application/vnd.oci.image.layer.nondistributable.v1.tar+zstd',
          ]);
          const DOCKER_LAYER_MEDIA_TYPES = new Set([
            'application/vnd.docker.image.rootfs.diff.tar',
            'application/vnd.docker.image.rootfs.diff.tar.gzip',
            'application/vnd.docker.image.rootfs.foreign.diff.tar',
            'application/vnd.docker.image.rootfs.foreign.diff.tar.gzip',
          ]);
          function sameFileIdentity(left, right) {
            return left.dev === right.dev && left.ino === right.ino;
          }
          function assertTargetTenantBinding(evidence, targetTenantId) {
            const present = Object.prototype.hasOwnProperty.call(evidence, 'targetTenantId');
            if (targetTenantId ? (!present || evidence.targetTenantId !== targetTenantId) : present) {
              throw new Error('Build evidence target tenant does not match.');
            }
          }
          function assertSourceModeBinding(evidence, sourceMode) {
            const present = Object.prototype.hasOwnProperty.call(evidence, 'sourceMode');
            if (present ? evidence.sourceMode !== sourceMode : sourceMode !== 'source-unknown') {
              throw new Error('Build evidence source mode does not match.');
            }
          }
          function canonicalUploadArtifactDigest(value) {
            if (typeof value === 'string' && /^[a-f0-9]{64}$/.test(value)) return `sha256:${value}`;
            if (typeof value === 'string' && SHA256_DIGEST.test(value)) return value;
            throw new Error('Current upload artifact digest is invalid.');
          }
          function assertCurrentUploadBinding(evidence, artifactId) {
            if (artifactId !== process.env.BUILD_IMAGE_ARTIFACT_ID || evidence.artifactDigest !== canonicalUploadArtifactDigest(process.env.BUILD_IMAGE_ARTIFACT_DIGEST)) {
              throw new Error('Build evidence artifact does not match the current upload step.');
            }
          }
          function assertGitHubArtifactBinding(evidence, artifact, runAttempt, artifactId) {
            const repositoryIdText = process.env.GITHUB_REPOSITORY_ID || '';
            const runIdText = process.env.GITHUB_RUN_ID || '';
            const runAttemptText = process.env.GITHUB_RUN_ATTEMPT || '';
            const repositoryId = Number(repositoryIdText);
