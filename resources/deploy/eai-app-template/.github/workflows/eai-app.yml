name: EAI App Deployment Handoff
run-name: EAI deploy ${{ inputs.app_key }} (${{ inputs.operation_id }})

on:
  workflow_dispatch:
    inputs:
      source_mode:
        description: Approved source authority for this deployment.
        required: false
        type: choice
        options:
          - source-unknown
          - eai-cli-generated
        default: source-unknown
      app_key:
        description: EAI app key to bind.
        required: true
      tenant_id:
        description: Company tenant ID that owns the app enrollment.
        required: true
      target_tenant_id:
        description: Signed hosting tenant bound to the CLI managed-source operation.
        required: false
      operation_id:
        description: Operation ID from eai app workflow-setup.
        required: true
      nonce:
        description: One-time nonce from eai app workflow-setup.
        required: true
      config_hash:
        description: Exact configuration hash approved by workflow setup.
        required: true
      commit_sha:
        description: Exact source commit approved by workflow setup.
        required: true
      public_api_url:
        description: Trusted EAI regional PublicAPI URL for this operation.
        required: false
      publicapi_base_url:
        description: Deprecated alias for public_api_url; retained for compatibility.
        required: false
      env:
        description: Deployment environment to bind; preferred input name.
        required: false
      environment:
        description: Deployment environment to bind; compatibility alias for env.
        required: false
      release_channel:
        description: Deprecated compatibility input; deployment environment is authoritative.
        required: false
  # Reusable compatibility is limited to a workflow_dispatch caller in this
  # repository at the same ref. PublicAPI verifies the signed caller
  # workflow_ref and canonical callee job_workflow_ref/job_workflow_sha.
  # The caller must grant contents/packages/actions read plus attestations and
  # id-token write; this workflow cannot elevate caller permissions.
  workflow_call:
    inputs:
      source_mode:
        description: Approved source authority for this deployment.
        required: false
        type: string
        default: source-unknown
      app_key:
        required: true
        type: string
      tenant_id:
        required: true
        type: string
      target_tenant_id:
        required: false
        type: string
      operation_id:
        required: true
        type: string
      nonce:
        required: true
        type: string
      config_hash:
        description: Exact configuration hash approved by workflow setup.
        required: true
        type: string
      commit_sha:
        description: Exact source commit; defaults to the reusable workflow caller SHA.
        required: false
        type: string
      public_api_url:
        required: false
        type: string
      publicapi_base_url:
        description: Deprecated alias for public_api_url.
        required: false
        type: string
      env:
        required: false
        type: string
      environment:
        description: Compatibility alias for env.
        required: false
        type: string
      release_channel:
        description: Deprecated compatibility input; accepted but not authoritative.
        required: false
        type: string
    secrets:
      EAI_ACCESS_TOKEN:
        description: Deprecated and intentionally unused.
        required: false
      EAI_PUBLIC_API_URL:
        description: Deprecated and intentionally unused; bind the endpoint with a workflow input.
        required: false

permissions:
  contents: read
  packages: read

concurrency:
  group: eai-app-${{ inputs.source_mode }}-${{ inputs.app_key }}-${{ inputs.env || inputs.environment || 'preview' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  EAI_WORKFLOW_PATH: .github/workflows/eai-app.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow invocation
        env:
          EAI_CALLER_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EAI_CALLER_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Managed deployment requires a manually dispatched caller." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Validate immutable dispatch and trusted endpoint
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_TENANT_ID: ${{ inputs.target_tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          NONCE: ${{ inputs.nonce }}
          CONFIG_HASH: ${{ inputs.config_hash }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env || inputs.environment || 'preview' }}
          LEGACY_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PREFERRED_DEPLOY_ENVIRONMENT: ${{ inputs.env }}
          EAI_BOUND_PUBLIC_API_URL: ${{ inputs.public_api_url || inputs.publicapi_base_url }}
          LEGACY_PUBLIC_API_URL: ${{ inputs.publicapi_base_url }}
          PREFERRED_PUBLIC_API_URL: ${{ inputs.public_api_url }}
          SOURCE_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
        run: |
          node scripts/source-unknown-deployment-evidence.mjs validate-dispatch \
            --source-mode "$SOURCE_MODE" \
            --app-key "$APP_KEY" \
            --tenant-id "$TENANT_ID" \
            --target-tenant-id "$TARGET_TENANT_ID" \
            --operation-id "$OPERATION_ID" \
            --nonce "$NONCE" \
            --expected-config-hash "$CONFIG_HASH" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --preferred-environment "$PREFERRED_DEPLOY_ENVIRONMENT" \
            --legacy-environment "$LEGACY_DEPLOY_ENVIRONMENT" \
            --public-api-url "$EAI_BOUND_PUBLIC_API_URL" \
            --preferred-public-api-url "$PREFERRED_PUBLIC_API_URL" \
            --legacy-public-api-url "$LEGACY_PUBLIC_API_URL" \
            --commit "$SOURCE_COMMIT_SHA" \
            --workflow-sha "$GITHUB_SHA"

      - name: Install dependencies without running application-controlled scripts
        run: npm ci --ignore-scripts

      - name: Run dependency install scripts without package credentials
        run: npm rebuild

      - name: Install Linux native CSS bindings
        run: npm install --no-save --package-lock=false lightningcss-linux-x64-gnu@1.30.2 @tailwindcss/oxide-linux-x64-gnu@4.1.18

      - name: Build deterministic Object Type outputs
        env:
          EAI_APP_KEY: ${{ inputs.app_key }}
          EAI_TENANT_ID: ${{ inputs.tenant_id }}
        run: npm run build:object-types

      - name: Validate application
        env:
          EAI_APP_KEY: ${{ inputs.app_key }}
          EAI_TENANT_ID: ${{ inputs.tenant_id }}
        shell: bash
        run: |
          set -uo pipefail
          npm run typecheck &
          typecheck_pid=$!
          npm run test:unit:ci &
          tests_pid=$!
          validation_status=0
          wait "$typecheck_pid" || validation_status=1
          wait "$tests_pid" || validation_status=1
          exit "$validation_status"

      - name: Build generated app
        env:
          EAI_APP_KEY: ${{ inputs.app_key }}
          EAI_TENANT_ID: ${{ inputs.tenant_id }}
        run: npm run build

      - name: Prepare image context
        run: node scripts/source-unknown-deployment-evidence.mjs prepare-image-context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build OCI image archive
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file .eai-build/image-context/Dockerfile \
            --metadata-file .eai-build/image-metadata.json \
            --output type=oci,dest=.eai-build/eai-generated-app-image.tar \
            .eai-build/image-context

      - name: Verify post-build source integrity
        env:
          SOURCE_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          git diff --exit-code -- . \
            ':(exclude)src/eai.config/object-types.json' \
            ':(exclude)src/eai.config/object-types.provisioning.json'
          untracked="$(git status --porcelain=v1 --untracked-files=all -- . \
            ':(exclude).eai-build/**' \
            ':(exclude)src/eai.config/object-types.json' \
            ':(exclude)src/eai.config/object-types.provisioning.json')"
          test -z "$untracked" || { printf '%s\n' "$untracked"; exit 1; }

      - name: Stage verified image artifact
        id: staged-image
        run: |
          node scripts/source-unknown-deployment-evidence.mjs stage-image-artifact \
            --root "$GITHUB_WORKSPACE" \
            --staging-root "$RUNNER_TEMP" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable image artifact
        id: image-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eai-generated-app-image
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: ${{ steps.staged-image.outputs.image_archive_path }}

      - name: Collect immutable build evidence
        id: evidence
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_TENANT_ID: ${{ inputs.target_tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          NONCE: ${{ inputs.nonce }}
          CONFIG_HASH: ${{ inputs.config_hash }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env || inputs.environment || 'preview' }}
          LEGACY_DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          PREFERRED_DEPLOY_ENVIRONMENT: ${{ inputs.env }}
          SOURCE_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
          STAGED_IMAGE_ARCHIVE: ${{ steps.staged-image.outputs.image_archive_path }}
          STAGED_ARCHIVE_DIGEST: ${{ steps.staged-image.outputs.archive_digest }}
          IMAGE_STAGING_ROOT: ${{ runner.temp }}
        run: |
          image_digest="$(node scripts/source-unknown-deployment-evidence.mjs read-image-digest)"
          node scripts/source-unknown-deployment-evidence.mjs collect \
            --source-mode "$SOURCE_MODE" \
            --target-tenant-id "$TARGET_TENANT_ID" \
            --app-key "$APP_KEY" \
            --tenant-id "$TENANT_ID" \
            --operation-id "$OPERATION_ID" \
            --nonce "$NONCE" \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$EAI_WORKFLOW_PATH" \
            --ref "$GITHUB_REF" \
            --branch "$GITHUB_REF_NAME" \
            --commit "$SOURCE_COMMIT_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment "$DEPLOY_ENVIRONMENT" \
            --preferred-environment "$PREFERRED_DEPLOY_ENVIRONMENT" \
            --legacy-environment "$LEGACY_DEPLOY_ENVIRONMENT" \
            --expected-config-hash "$CONFIG_HASH" \
            --image-archive "$STAGED_IMAGE_ARCHIVE" \
            --image-staging-root "$IMAGE_STAGING_ROOT" \
            --expected-archive-digest "$STAGED_ARCHIVE_DIGEST" \
            --artifact-id "${{ steps.image-artifact.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.image-artifact.outputs.artifact-digest }}" \
            --image-digest "$image_digest"

      - name: Upload immutable build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eai-generated-app-evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          path: .eai-build/evidence/source-unknown-deployment-evidence.json

  handoff:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Download immutable image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eai-generated-app-image
          path: .eai-build

      - name: Download immutable build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eai-generated-app-evidence
          path: .eai-build/evidence

      - name: Validate exact handoff binding
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          TARGET_TENANT_ID: ${{ inputs.target_tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          NONCE: ${{ inputs.nonce }}
          CONFIG_HASH: ${{ inputs.config_hash }}
          DEPLOY_ENVIRONMENT: ${{ inputs.env || inputs.environment || 'preview' }}
          EAI_BOUND_PUBLIC_API_URL: ${{ inputs.public_api_url || inputs.publicapi_base_url }}
          SOURCE_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          [[ "$EAI_BOUND_PUBLIC_API_URL" =~ ^https://(dev-api\.au|(test-api|api)\.(au|ca|eu))\.myenterprise\.ai/public/?$ ]]
          [[ "$APP_KEY" =~ ^[a-z][a-z0-9-]{1,62}$ ]]
          [[ "$TENANT_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._:-]{0,254}[A-Za-z0-9])?$ ]]
          if [[ "$SOURCE_MODE" == "eai-cli-generated" || -n "$TARGET_TENANT_ID" ]]; then
            [[ "$TARGET_TENANT_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._:-]{0,254}[A-Za-z0-9])?$ ]]
          fi
          [[ "$OPERATION_ID" =~ ^[A-Za-z0-9]([A-Za-z0-9._~:-]{0,254}[A-Za-z0-9])?$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONFIG_HASH" =~ ^sha256:[a-f0-9]{64}$ ]]
          node - <<'NODE'
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const { isDeepStrictEqual } = require('node:util');
          const MAX_IMAGE_ARCHIVE_BYTES = 10 * 1024 * 1024 * 1024;
          const MAX_GOVERNED_CONFIG_FILE_BYTES = 10 * 1024 * 1024;
          const MAX_GOVERNED_CONFIG_TOTAL_BYTES = 32 * 1024 * 1024;
          const MAX_GOVERNED_CONFIG_FILES = 4096;
          const MAX_BUILD_EVIDENCE_BYTES = 1024 * 1024;
          const MAX_PRODUCER_SOURCE_BYTES = 1024 * 1024;
          const MAX_GITHUB_METADATA_RESPONSE_BYTES = 1024 * 1024;
          const MAX_GITHUB_TREE_RESPONSE_BYTES = 16 * 1024 * 1024;
          const MAX_GITHUB_BLOB_RESPONSE_BYTES = 16 * 1024 * 1024;
          function sameFileIdentity(left, right) {
            return left.dev === right.dev && left.ino === right.ino;
          }
          function snapshotDirectoryPath(filePath, label) {
            const target = path.resolve(path.dirname(filePath));
            const filesystemRoot = path.parse(target).root;
            const identities = [];
            let current = filesystemRoot;
            for (const component of ['', ...path.relative(filesystemRoot, target).split(/[\\/]/).filter(Boolean)]) {
              if (component) current = path.join(current, component);
              const status = fs.lstatSync(current);
              if (status.isSymbolicLink() || !status.isDirectory()) throw new Error(`${label} ancestors must be no-follow directories.`);
              identities.push({ path: current, dev: status.dev, ino: status.ino });
            }
            return identities;
          }
          function assertDirectorySnapshot(identities, label) {
            for (const identity of identities) {
              const status = fs.lstatSync(identity.path);
              if (status.isSymbolicLink() || !status.isDirectory() || !sameFileIdentity(identity, status)) throw new Error(`${label} ancestors changed during verification.`);
            }
          }
          function readBoundedRegularFile(filePath, maxBytes, label) {
            const ancestors = snapshotDirectoryPath(filePath, label);
            const before = fs.lstatSync(filePath);
            if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1) throw new Error(`${label} must be a no-follow regular file.`);
            if (!Number.isSafeInteger(before.size) || before.size < 1 || before.size > maxBytes) throw new Error(`${label} is empty or exceeds its byte limit.`);
            if (typeof fs.constants.O_NOFOLLOW !== 'number') throw new Error(`No-follow ${label} verification is unavailable.`);
            const descriptor = fs.openSync(filePath, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
            try {
              const opened = fs.fstatSync(descriptor);
              assertDirectorySnapshot(ancestors, label);
              if (!opened.isFile() || opened.nlink !== 1 || !sameFileIdentity(before, opened) || opened.size !== before.size || opened.mtimeMs !== before.mtimeMs || opened.ctimeMs !== before.ctimeMs) throw new Error(`${label} changed before verification.`);
              const chunks = [];
              const buffer = Buffer.allocUnsafe(64 * 1024);
              let offset = 0;
              while (offset < opened.size) {
                const bytesRead = fs.readSync(descriptor, buffer, 0, Math.min(buffer.length, opened.size - offset), offset);
                if (bytesRead < 1) throw new Error(`${label} was truncated during verification.`);
                chunks.push(Buffer.from(buffer.subarray(0, bytesRead)));
                offset += bytesRead;
              }
              const growthProbe = Buffer.allocUnsafe(1);
              if (fs.readSync(descriptor, growthProbe, 0, 1, offset) !== 0) throw new Error(`${label} grew during verification.`);
              const afterDescriptor = fs.fstatSync(descriptor);
              assertDirectorySnapshot(ancestors, label);
              const afterPath = fs.lstatSync(filePath);
              for (const current of [afterDescriptor, afterPath]) {
                if (!current.isFile() || current.nlink !== 1 || !sameFileIdentity(opened, current) || current.size !== opened.size || current.mtimeMs !== opened.mtimeMs || current.ctimeMs !== opened.ctimeMs) throw new Error(`${label} changed during verification.`);
              }
              return Buffer.concat(chunks, offset);
            } finally {
              fs.closeSync(descriptor);
            }
          }
          function hashBoundedRegularFile(filePath, maxBytes) {
            const ancestors = snapshotDirectoryPath(filePath, 'Downloaded image archive');
            const before = fs.lstatSync(filePath);
            if (!before.isFile() || before.isSymbolicLink() || before.nlink !== 1) throw new Error('Downloaded image archive must be a no-follow regular file.');
            if (!Number.isSafeInteger(before.size) || before.size < 1 || before.size > maxBytes) throw new Error('Downloaded image archive is empty or exceeds the handoff byte limit.');
            if (typeof fs.constants.O_NOFOLLOW !== 'number') throw new Error('No-follow archive verification is unavailable.');
            const descriptor = fs.openSync(filePath, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
            try {
              const opened = fs.fstatSync(descriptor);
              assertDirectorySnapshot(ancestors, 'Downloaded image archive');
              if (!opened.isFile() || opened.nlink !== 1 || !sameFileIdentity(before, opened) || opened.size !== before.size || opened.mtimeMs !== before.mtimeMs || opened.ctimeMs !== before.ctimeMs) throw new Error('Downloaded image archive changed before verification.');
              const hash = createHash('sha256');
              const buffer = Buffer.allocUnsafe(1024 * 1024);
              let offset = 0;
              while (offset < opened.size) {
                const bytesRead = fs.readSync(descriptor, buffer, 0, Math.min(buffer.length, opened.size - offset), offset);
                if (bytesRead < 1) throw new Error('Downloaded image archive was truncated during verification.');
                hash.update(buffer.subarray(0, bytesRead));
                offset += bytesRead;
              }
              const growthProbe = Buffer.allocUnsafe(1);
              if (fs.readSync(descriptor, growthProbe, 0, 1, offset) !== 0) throw new Error('Downloaded image archive grew during verification.');
              const afterDescriptor = fs.fstatSync(descriptor);
              assertDirectorySnapshot(ancestors, 'Downloaded image archive');
              const afterPath = fs.lstatSync(filePath);
              for (const current of [afterDescriptor, afterPath]) {
                if (!current.isFile() || current.nlink !== 1 || !sameFileIdentity(opened, current) || current.size !== opened.size || current.mtimeMs !== opened.mtimeMs || current.ctimeMs !== opened.ctimeMs) throw new Error('Downloaded image archive changed during verification.');
              }
              return `sha256:${hash.digest('hex')}`;
            } finally {
              fs.closeSync(descriptor);
            }
          }
          const evidence = JSON.parse(readBoundedRegularFile(
            '.eai-build/evidence/source-unknown-deployment-evidence.json',
            MAX_BUILD_EVIDENCE_BYTES,
            'Downloaded build evidence',
          ).toString('utf8'));
          const expected = {
            operationId: process.env.OPERATION_ID,
            nonce: process.env.NONCE,
            environment: process.env.DEPLOY_ENVIRONMENT,
            commitSha: process.env.SOURCE_COMMIT_SHA,
            configHash: process.env.CONFIG_HASH,
            workflowPath: process.env.EAI_WORKFLOW_PATH,
            ref: process.env.GITHUB_REF,
          };
          for (const [key, value] of Object.entries(expected)) {
            if (evidence[key] !== value) throw new Error(`Build evidence ${key} does not match the exact dispatch.`);
          }
          if ((evidence.sourceMode || 'source-unknown') !== process.env.SOURCE_MODE) throw new Error('Build evidence source mode does not match.');
          if (process.env.TARGET_TENANT_ID && evidence.targetTenantId !== process.env.TARGET_TENANT_ID) throw new Error('Build evidence target tenant does not match.');
          if (String(evidence.workflowRun?.id) !== process.env.GITHUB_RUN_ID || String(evidence.workflowRun?.attempt) !== process.env.GITHUB_RUN_ATTEMPT) throw new Error('Build evidence workflow run does not match.');
          if (evidence.validationSummary?.status !== 'passed') throw new Error('Build evidence validation did not pass.');
          const archiveDigest = hashBoundedRegularFile('.eai-build/eai-generated-app-image.tar', MAX_IMAGE_ARCHIVE_BYTES);
          if (evidence.imageArtifact?.archiveDigest !== archiveDigest) throw new Error('Downloaded image archive does not match build evidence.');
          if (evidence.imageArtifact?.name !== 'eai-generated-app-image' || !/^[1-9][0-9]*$/.test(String(evidence.imageArtifact?.id || ''))) throw new Error('Build evidence image artifact identity is invalid.');
          if (new Set([evidence.artifactDigest, evidence.imageArtifact.archiveDigest, evidence.imageDigest]).size !== 3) throw new Error('Build evidence digests must be independently bound.');
          const index = JSON.parse(execFileSync('tar', ['-xOf', '.eai-build/eai-generated-app-image.tar', 'index.json'], { encoding: 'utf8', maxBuffer: 1024 * 1024 }));
          const imageManifests = Array.isArray(index.manifests) ? index.manifests.filter((entry) => entry?.platform?.os === 'linux' && entry?.platform?.architecture === 'amd64') : [];
          if (imageManifests.length !== 1 || imageManifests[0].digest !== evidence.imageDigest) throw new Error('Downloaded OCI image digest does not match build evidence.');

          const repositoryParts = process.env.GITHUB_REPOSITORY.split('/');
          if (repositoryParts.length !== 2) throw new Error('GitHub repository identity is invalid.');
          const apiBase = `https://api.github.com/repos/${repositoryParts.map(encodeURIComponent).join('/')}`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
          };
          async function github(path, accept = headers.Accept) {
            const response = await fetch(`${apiBase}${path}`, { headers: { ...headers, Accept: accept }, redirect: 'error' });
            if (!response.ok) throw new Error(`GitHub provenance read failed (${response.status}).`);
            return response;
          }
          async function readBoundedResponseBytes(response, maxBytes, label) {
            const contentLength = response.headers.get('content-length');
            if (contentLength !== null) {
              if (!/^(?:0|[1-9][0-9]*)$/.test(contentLength)) throw new Error(`${label} returned an invalid content length.`);
              const declaredBytes = Number(contentLength);
              if (!Number.isSafeInteger(declaredBytes) || declaredBytes > maxBytes) throw new Error(`${label} exceeds its byte limit.`);
            }
            if (!response.body) throw new Error(`${label} did not return a response body.`);
            const reader = response.body.getReader();
            const chunks = [];
            let totalBytes = 0;
            try {
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                if (!(value instanceof Uint8Array) || value.byteLength > maxBytes - totalBytes) {
                  await reader.cancel().catch(() => {});
                  throw new Error(`${label} exceeds its byte limit.`);
                }
                chunks.push(Buffer.from(value));
                totalBytes += value.byteLength;
              }
            } finally {
              reader.releaseLock();
            }
            return Buffer.concat(chunks, totalBytes);
          }
          async function readBoundedResponseJson(response, maxBytes, label) {
            return JSON.parse((await readBoundedResponseBytes(response, maxBytes, label)).toString('utf8'));
          }
          async function githubJson(path, maxBytes, label) {
            return readBoundedResponseJson(await github(path), maxBytes, label);
          }
          async function sourceBytes(path, maxBytes, label) {
            const encoded = path.split('/').map(encodeURIComponent).join('/');
            const response = await github(`/contents/${encoded}?ref=${encodeURIComponent(process.env.SOURCE_COMMIT_SHA)}`, 'application/vnd.github.raw+json');
            return readBoundedResponseBytes(response, maxBytes, label);
          }
          function validateSchemaProvenance(provenance) {
            if (!provenance || typeof provenance !== 'object' || Array.isArray(provenance)) throw new Error('Source runtime schema provenance is required.');
            const canonicalFields = new Set([
              'templateVersion',
              'baseTemplateSha',
              'approvedSourceSha',
              'approvedReleaseId',
              'schemaDigest',
              'validatorDigest',
            ]);
            if (Object.keys(provenance).some((key) => !canonicalFields.has(key))) throw new Error('Source runtime schema provenance contains a noncanonical field.');
            for (const key of ['schemaDigest', 'validatorDigest']) {
              if (!/^sha256:[a-f0-9]{64}$/.test(provenance[key] || '')) throw new Error(`Source runtime schema provenance ${key} must be a sha256 digest.`);
            }
            if (typeof provenance.templateVersion !== 'string' || !provenance.templateVersion.trim() || provenance.templateVersion.trim() !== provenance.templateVersion || /[\r\n]/.test(provenance.templateVersion)) throw new Error('Source runtime schema provenance templateVersion is invalid.');
            const anchors = [
              ['baseTemplateSha', provenance.baseTemplateSha, /^[a-f0-9]{40}$/],
              ['approvedSourceSha', provenance.approvedSourceSha, /^[a-f0-9]{40}$/],
              ['approvedReleaseId', provenance.approvedReleaseId, /\S/],
            ];
            if (!anchors.some(([, value]) => value !== undefined)) throw new Error('Source runtime schema provenance requires an approved anchor.');
            for (const [key, value, pattern] of anchors) {
              if (value !== undefined && (typeof value !== 'string' || value.trim() !== value || /[\r\n]/.test(value) || !pattern.test(value))) throw new Error(`Source runtime schema provenance ${key} is invalid.`);
            }
            return provenance;
          }
          async function sourceConfigHash() {
            const rootFiles = new Set(['eai.config.ts', 'eai.runtime.json']);
            const generatedFiles = new Set([
              'src/eai.config/object-types.json',
              'src/eai.config/object-types.provisioning.json',
            ]);
            const commit = await githubJson(
              `/git/commits/${encodeURIComponent(process.env.SOURCE_COMMIT_SHA)}`,
              MAX_GITHUB_METADATA_RESPONSE_BYTES,
              'GitHub commit response',
            );
            if (commit.sha !== process.env.SOURCE_COMMIT_SHA || !/^[a-f0-9]{40}$/.test(commit.tree?.sha || '')) throw new Error('Exact source commit tree is invalid.');
            const tree = await githubJson(
              `/git/trees/${commit.tree.sha}?recursive=1`,
              MAX_GITHUB_TREE_RESPONSE_BYTES,
              'GitHub source tree response',
            );
            if (tree.truncated || !Array.isArray(tree.tree)) throw new Error('Exact source tree is incomplete.');
            const entries = [];
            const seen = new Set();
            let totalBytes = 0;
            for (const entry of tree.tree) {
              const path = typeof entry?.path === 'string' ? entry.path : '';
              const governedRoot = rootFiles.has(path);
              const governedTree = path === 'src/eai.config' || path.startsWith('src/eai.config/');
              if (!governedRoot && !governedTree) continue;
              if (!path || path.includes('\0') || seen.has(path)) throw new Error('Governed source tree contains an invalid path.');
              seen.add(path);
              if (entry.type === 'tree') {
                if (governedRoot) throw new Error(`Governed configuration must be a regular Git blob: ${path}`);
                continue;
              }
              if (entry.type !== 'blob' || !['100644', '100755'].includes(entry.mode)) throw new Error(`Governed configuration must be a regular Git blob: ${path}`);
              if (generatedFiles.has(path)) continue;
              if (!/^[a-f0-9]{40}$/.test(entry.sha || '') || !Number.isSafeInteger(entry.size) || entry.size < 0 || entry.size > MAX_GOVERNED_CONFIG_FILE_BYTES) throw new Error(`Governed configuration blob is invalid or too large: ${path}`);
              totalBytes += entry.size;
              if (entries.length >= MAX_GOVERNED_CONFIG_FILES || totalBytes > MAX_GOVERNED_CONFIG_TOTAL_BYTES) throw new Error('Governed configuration manifest exceeds its handoff bounds.');
              entries.push(entry);
            }
            if (!entries.some((entry) => entry.path === 'eai.runtime.json')) throw new Error('eai.runtime.json is required in the exact source commit.');
            const sortedEntries = entries.sort((left, right) => left.path < right.path ? -1 : left.path > right.path ? 1 : 0);
            const blobs = new Array(sortedEntries.length);
            let nextEntry = 0;
            async function fetchGovernedBlob() {
              while (nextEntry < sortedEntries.length) {
                const index = nextEntry;
                nextEntry += 1;
                const entry = sortedEntries[index];
                const blob = await githubJson(
                  `/git/blobs/${entry.sha}`,
                  MAX_GITHUB_BLOB_RESPONSE_BYTES,
                  `GitHub governed blob response for ${entry.path}`,
                );
                if (blob.encoding !== 'base64' || blob.sha !== entry.sha || blob.size !== entry.size || typeof blob.content !== 'string') throw new Error(`Governed configuration blob metadata changed: ${entry.path}`);
                const bytes = Buffer.from(blob.content.replace(/\s/g, ''), 'base64');
                const blobSha = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
                if (bytes.length !== entry.size || blobSha !== entry.sha) throw new Error(`Governed configuration blob bytes changed: ${entry.path}`);
                blobs[index] = { path: entry.path, bytes };
              }
            }
            await Promise.all(Array.from({ length: Math.min(8, sortedEntries.length) }, () => fetchGovernedBlob()));
            const hash = createHash('sha256');
            for (const blob of blobs) hash.update(blob.path).update('\0').update(blob.bytes).update('\0');
            return `sha256:${hash.digest('hex')}`;
          }
          (async () => {
            const [workflowBytes, collectorBytes, runtimeBytes, canonicalConfigHash, artifactResponse] = await Promise.all([
              sourceBytes(process.env.EAI_WORKFLOW_PATH, MAX_PRODUCER_SOURCE_BYTES, 'Canonical workflow source'),
              sourceBytes('scripts/source-unknown-deployment-evidence.mjs', MAX_PRODUCER_SOURCE_BYTES, 'Canonical collector source'),
              sourceBytes('eai.runtime.json', MAX_GOVERNED_CONFIG_FILE_BYTES, 'Governed runtime source'),
              sourceConfigHash(),
              github(`/actions/artifacts/${evidence.imageArtifact.id}`),
            ]);
            if (canonicalConfigHash !== process.env.CONFIG_HASH || canonicalConfigHash !== evidence.configHash) throw new Error('Exact source configuration does not match dispatch and build evidence.');
            const workflowBlobSha = createHash('sha1').update(`blob ${workflowBytes.length}\0`).update(workflowBytes).digest('hex');
            const collectorDigest = `sha256:${createHash('sha256').update(collectorBytes).digest('hex')}`;
            if (evidence.workflowBlobSha !== workflowBlobSha || evidence.collectorDigest !== collectorDigest) throw new Error('Canonical workflow or collector bytes do not match build evidence.');
            const runtime = JSON.parse(runtimeBytes.toString('utf8'));
            const sourceProvenance = validateSchemaProvenance(runtime.schemaProvenance);
            if (!isDeepStrictEqual(evidence.schemaProvenance, sourceProvenance)) throw new Error('Source runtime provenance does not match build evidence.');
            const artifact = await readBoundedResponseJson(
              artifactResponse,
              MAX_GITHUB_METADATA_RESPONSE_BYTES,
              'GitHub artifact response',
            );
            if (String(artifact.id) !== String(evidence.imageArtifact.id) || artifact.name !== evidence.imageArtifact.name || artifact.digest !== evidence.artifactDigest || String(artifact.workflow_run?.id) !== process.env.GITHUB_RUN_ID) throw new Error('GitHub artifact metadata does not match build evidence.');
          })().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exitCode = 1;
          });
          NODE

      - name: Attest immutable image archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: .eai-build/eai-generated-app-image.tar

      - name: Request GitHub OIDC token and submit workflow evidence
        env:
          APP_KEY: ${{ inputs.app_key }}
          TENANT_ID: ${{ inputs.tenant_id }}
          OPERATION_ID: ${{ inputs.operation_id }}
          EAI_BOUND_PUBLIC_API_URL: ${{ inputs.public_api_url || inputs.publicapi_base_url }}
          SOURCE_MODE: ${{ inputs.source_mode || 'source-unknown' }}
        run: |
          case "$SOURCE_MODE" in
            source-unknown) audience=api://enterprise-ai-publicapi/source-unknown ;;
            eai-cli-generated) audience=api://enterprise-ai-publicapi/eai-cli-generated ;;
            *) exit 1 ;;
          esac
          response="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-redirs 0 --max-filesize 1048576 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}")"
          token="$(node -e "let s=''; process.stdin.on('data', d => s += d); process.stdin.on('end', () => process.stdout.write(JSON.parse(s).value));" <<< "$response")"
          echo "::add-mask::$token"
          [[ "$EAI_BOUND_PUBLIC_API_URL" =~ ^https://(dev-api\.au|(test-api|api)\.(au|ca|eu))\.myenterprise\.ai/public/?$ ]]
          case "$SOURCE_MODE" in
            source-unknown) evidence_path="source-unknown/workflow-evidence" ;;
            eai-cli-generated) evidence_path="cli-managed-source/operations/${OPERATION_ID}/workflow-evidence" ;;
            *) exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 --max-redirs 0 \
            --max-filesize 1048576 \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data-binary @.eai-build/evidence/source-unknown-deployment-evidence.json \
            --output .eai-build/evidence/workflow-evidence-response.json \
            "${EAI_BOUND_PUBLIC_API_URL%/}/v4/platform/tenants/${TENANT_ID}/apps/${APP_KEY}/${evidence_path}"

      - name: Assert evidence accepted
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const responsePath = '.eai-build/evidence/workflow-evidence-response.json';
          const maxBytes = 1024 * 1024;
          const sameFileIdentity = (left, right) => left.dev === right.dev && left.ino === right.ino;
          const targetDirectory = path.resolve(path.dirname(responsePath));
          const filesystemRoot = path.parse(targetDirectory).root;
          const ancestors = [];
          let current = filesystemRoot;
          for (const component of ['', ...path.relative(filesystemRoot, targetDirectory).split(/[\\/]/).filter(Boolean)]) {
            if (component) current = path.join(current, component);
            const status = fs.lstatSync(current);
            if (status.isSymbolicLink() || !status.isDirectory()) throw new Error('Deployment handoff response ancestors must be no-follow directories.');
            ancestors.push({ path: current, dev: status.dev, ino: status.ino });
          }
          const assertAncestors = () => {
            for (const identity of ancestors) {
              const status = fs.lstatSync(identity.path);
              if (status.isSymbolicLink() || !status.isDirectory() || !sameFileIdentity(identity, status)) throw new Error('Deployment handoff response ancestors changed during verification.');
            }
          };
          const before = fs.lstatSync(responsePath);
          if (before.isSymbolicLink() || !before.isFile() || before.nlink !== 1 || !Number.isSafeInteger(before.size) || before.size < 1 || before.size > maxBytes) throw new Error('Deployment handoff response must be a bounded no-follow regular file.');
          if (typeof fs.constants.O_NOFOLLOW !== 'number') throw new Error('No-follow response verification is unavailable.');
          const descriptor = fs.openSync(responsePath, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW);
          let bytes;
          try {
            const opened = fs.fstatSync(descriptor);
            assertAncestors();
            if (!opened.isFile() || opened.nlink !== 1 || !sameFileIdentity(before, opened) || opened.size !== before.size || opened.mtimeMs !== before.mtimeMs || opened.ctimeMs !== before.ctimeMs) throw new Error('Deployment handoff response changed before verification.');
            const chunks = [];
            const buffer = Buffer.allocUnsafe(64 * 1024);
            let offset = 0;
            while (offset < opened.size) {
              const bytesRead = fs.readSync(descriptor, buffer, 0, Math.min(buffer.length, opened.size - offset), offset);
              if (bytesRead < 1) throw new Error('Deployment handoff response was truncated during verification.');
              chunks.push(Buffer.from(buffer.subarray(0, bytesRead)));
              offset += bytesRead;
            }
            const growthProbe = Buffer.allocUnsafe(1);
            if (fs.readSync(descriptor, growthProbe, 0, 1, offset) !== 0) throw new Error('Deployment handoff response grew during verification.');
            const afterDescriptor = fs.fstatSync(descriptor);
            assertAncestors();
            const afterPath = fs.lstatSync(responsePath);
            for (const status of [afterDescriptor, afterPath]) {
              if (!status.isFile() || status.nlink !== 1 || !sameFileIdentity(opened, status) || status.size !== opened.size || status.mtimeMs !== opened.mtimeMs || status.ctimeMs !== opened.ctimeMs) throw new Error('Deployment handoff response changed during verification.');
            }
            bytes = Buffer.concat(chunks, offset);
          } finally {
            fs.closeSync(descriptor);
          }
          const body = JSON.parse(bytes.toString('utf8'));
          const response = body && typeof body.response === 'object' && !Array.isArray(body.response) ? body.response : body;
          const accepted = response.status === 'accepted';
          const deferred = response.status === 'handoff_pending' && response.requiresTenantInfra === true && typeof response.deploymentRequestId === 'string' && response.deploymentRequestId.trim();
          if (!accepted && !deferred) throw new Error(`Expected accepted evidence or persisted handoff, got ${response.status || '<missing>'}.`);
          NODE

      - name: Upload handoff responses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eai-source-unknown-handoff-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
          path: .eai-build/evidence/workflow-evidence-response.json
