version: 1
catalog:
  - errorId: EAI_CLI_MISSING
    match:
      containsAny:
        - 'command not found: eai'
        - 'eai: command not found'
    meaning: EAI CLI is not installed or not on PATH.
    likelyCause: Local workstation or container is missing the CLI.
    recovery:
      - 'npm install -g eai-cli'
      - 'If npmjs is unavailable: npm install -g @enterpriseai/cli --@enterpriseai:registry=https://eai-support.github.io/eai/registry/'
      - 'eai --version'
    nextGate: cli_installed
  - errorId: EAI_CLI_OUTDATED
    match:
      containsAny:
        - 'update available'
        - 'upgrade required'
        - 'behind latest'
    meaning: Installed EAI CLI is behind the expected release.
    likelyCause: Global CLI package has not been updated.
    recovery:
      - 'eai update --check'
      - 'eai update'
      - 'eai --describe'
    nextGate: cli_release_current
  - errorId: EAI_NOT_LOGGED_IN
    match:
      containsAny:
        - 'not logged in'
        - 'login required'
        - 'token expired'
    meaning: The current session has no usable EAI authentication.
    likelyCause: User has not logged in or the token has expired.
    recovery:
      - 'eai login'
      - 'eai whoami'
      - 'eai tenant list --format json'
    nextGate: tenant_ready
  - errorId: EAI_TENANT_ACCESS_REQUIRED
    match:
      containsAny:
        - 'no tenant'
        - 'tenant required'
        - 'insufficient tenant role'
    meaning: The user lacks the tenant context needed for app delivery.
    likelyCause: No membership, wrong tenant, or insufficient role.
    recovery:
      - 'eai tenant list --format json'
      - 'eai tenant select <tenant-slug>'
      - 'eai whoami'
    nextGate: tenant_ready
  - errorId: EAI_USER_INVITE_EXTERNAL_SERVICE_EXISTING_MEMBER
    match:
      containsAny:
        - 'user_invite_external_service_existing_member'
        - 'EXTERNAL_SERVICE_ERROR'
        - 'Invite failed'
        - 'eai user invite'
        - '502'
    meaning: A tenant member invite or role assignment reached an external service failure, and the target person may already exist as a direct tenant member with the wrong role.
    likelyCause: The invite/add path failed after, or despite, an existing tenant member record. Retrying the same invite may not change the member role.
    recovery:
      - 'Run eai errors explain user_invite_external_service_existing_member --format json when advertised'
      - 'eai whoami'
      - 'eai user roles --tenant <tenant-id> --format json'
      - 'eai user list --tenant <tenant-id> --search <email> --format json'
      - 'If an existing direct member is present and the user approves, run eai user role set --tenant <tenant-id> --member-id <member-id> --role tenant-admin --format json'
      - 'Verify the member read-back with eai user list --tenant <tenant-id> --search <email> --format json'
      - 'Tell the affected app user to sign out and sign back in because Auth.js session or JWT role data may be cached'
      - 'Do not edit databases or cloud portals directly unless EAI guidance reports an operator-only block'
    nextGate: tenant_member_role_verified
  - errorId: EAI_APP_TOKEN_TENANT_CONTEXT_REQUIRED
    match:
      containsAny:
        - 'app_token_tenant_context_required'
        - 'MISSING_TENANT'
        - 'Tenant context required for app tokens'
    meaning: A platform automation app-token user lookup reached EAI but did not carry the required tenant context.
    likelyCause: The caller used a root platform user or membership route such as /v4/platform/users/by-email or /v4/platform/users/{oid}/memberships instead of the tenant-scoped /v4/platform/tenants/{tenantId}/... route family, or the target environment has not deployed the matching PublicAPI/AdminAPI tenant-scoped routing hardening.
    recovery:
      - 'Run eai errors explain app_token_tenant_context_required --format json when advertised'
      - 'eai whoami'
      - 'eai tenant list --format json'
      - 'Do not start by changing tenant members, role definitions, Entra configuration, databases, or cloud portals'
      - 'Retry user lookup through /v4/platform/tenants/<tenant-id>/users/by-email?email=<email>'
      - 'Retry membership lookup through /v4/platform/tenants/<tenant-id>/users/<oid>/memberships'
      - 'Keep tenant member and role-definition reads on /v4/platform/tenants/<tenant-id>/members and /v4/platform/tenants/<tenant-id>/role-definitions'
      - 'If tenant-scoped routes still return MISSING_TENANT, capture redacted route shape, HTTP status, server code, CLI version, active tenant slug, and deployed PublicAPI/AdminAPI versions for platform support'
    nextGate: tenant_scoped_platform_route_verified
  - errorId: EAI_ENTRA_REDIRECT_URI_MISMATCH
    match:
      containsAny:
        - 'AADSTS50011'
        - 'reply URL specified in the request does not match'
        - 'redirect URI does not match'
        - 'redirect_uri'
        - '/api/auth/callback/microsoft-entra-id'
    meaning: The live app is sending an Entra callback URL that is not registered on the selected Entra app registration.
    likelyCause: Preview or deployed host changed, Entra provisioning has not been refreshed for the app, or the runtime client ID points at an app registration without the confirmed callback URI.
    recovery:
      - 'eai whoami'
      - 'eai tenant list --format json'
      - 'eai tenant select <tenant-slug-or-id> when the active tenant is wrong'
      - 'Confirm the callback route from the failing browser log in the active session; record only a redacted pattern such as https://<app-host>/api/auth/callback/...'
      - 'eai provision entra --force --redirect-uri <confirmed-callback-uri>'
      - 'Use --debug only with explicit user approval, and redact private hostnames, tenant IDs, client IDs, tokens, and raw debug output before writing artifacts'
      - 'Retry the sign-in flow and confirm the authorize request now uses the registered redirect_uri'
      - 'If mismatch persists, align AUTH_ENTRA_CLIENT_ID or ENTRA_CLIENT_ID with the Entra app registration returned by EAI'
    nextGate: entra_redirect_registered
  - errorId: EAI_NOT_PROJECT
    match:
      containsAny:
        - 'E001'
        - 'Not in an EAI project'
    meaning: The current repo is not initialized from the EAI app template.
    likelyCause: Template init has not run in this repo or folder.
    recovery:
      - 'Run /gofer:eai-first-run'
      - 'Confirm folder choice and tenant'
      - 'eai init <app-name> --skip-prompts --company-tenant <active-tenant-id>'
    nextGate: template_ready
  - errorId: EAI_TEMPLATE_DRIFT
    match:
      containsAny:
        - 'template drift'
        - 'template check failed'
        - 'template out of date'
    meaning: Repo template files have drifted from the expected EAI template baseline.
    likelyCause: Local repo changes or newer template release not applied.
    recovery:
      - 'eai template check --format json'
      - 'Follow the advertised refresh or reconcile path from eai --describe'
    nextGate: template_drift_resolved
  - errorId: EAI_GOFER_DRIFT
    match:
      containsAny:
        - 'gofer refresh'
        - 'gofer scaffold drift'
        - 'refresh required'
    meaning: The Gofer scaffold inside the repo is behind the expected version.
    likelyCause: Repo Gofer assets were not refreshed after a CLI/plugin update.
    recovery:
      - 'eai gofer refresh --check --format json'
      - 'Run the advertised refresh path'
      - 'node .specify/scripts/node/gofer-workspace-check.mjs --host auto --json'
    nextGate: gofer_drift_resolved
  - errorId: EAI_VERTICAL_NOT_SELECTED
    match:
      containsAny:
        - 'no vertical selected'
        - 'select app first'
        - 'app key required'
    meaning: App-scoped work started before selecting the target app.
    likelyCause: '`eai app select` has not been run for the active tenant.'
    recovery:
      - 'eai app list --format json'
      - 'eai app select <key> --format json'
    nextGate: app_selected
  - errorId: EAI_PROVISION_REQUIRED_FOR_TYPES
    match:
      containsAny:
        - 'App resources must be provisioned before publishing object types'
        - '409'
    meaning: Object types cannot be published until app resources are provisioned.
    likelyCause: '`eai types seed` ran before `eai app provision` completed.'
    recovery:
      - 'eai app provision <key> --tenant-id <tenant-id> --select --format json'
      - 'eai types validate --tenant-key <key> --tenant-id <tenant-id>'
      - 'eai types seed --tenant-key <key> --tenant-id <tenant-id> --format json'
    nextGate: types_publish_ready
  - errorId: EAI_APP_MANIFEST_VALIDATION_FAILED
    match:
      containsAny:
        - 'app_manifest_validation_failed'
        - 'app manifest save failed for both supported request shapes'
    meaning: The maintained CLI could not match the deployed app-manifest request contract.
    likelyCause: The installed CLI is old, or another manifest field fails after request-shape negotiation.
    recovery:
      - 'eai update --check'
      - 'If eai update --check reports upgrade_required, obtain approval and run eai update'
      - 'eai types validate --tenant-key <key> --tenant-id <tenant-id>'
      - 'eai types seed --tenant-key <key> --tenant-id <tenant-id> --dry-run --format json'
      - 'eai types seed --tenant-key <key> --tenant-id <tenant-id> --format json'
    nextGate: types_publish_ready
  - errorId: EAI_RESOURCE_NOT_READY
    match:
      containsAny:
        - '503'
        - 'Service Unavailable'
        - 'storage not ready'
        - 'preview not ready'
    meaning: Backing resources or preview surfaces are not ready yet.
    likelyCause: Provisioning completed partially or downstream services are still unhealthy.
    recovery:
      - 'eai resources storage status --tenant-id <tenant-id> --format json'
      - 'eai resources storage doctor --tenant-id <tenant-id> --format json'
      - 'eai verify storage --tenant-id <tenant-id>'
      - 'eai resources schema --tenant-id <tenant-id> --format json'
    nextGate: schema_storage_ready
  - errorId: EAI_RESOURCEAPI_TENANT_CONTEXT_MISSING
    match:
      containsAny:
        - 'RESOURCEAPI_TENANT_CONTEXT_MISSING'
        - 'missing_tenant_context'
    meaning: PublicAPI could not resolve tenant context for a tenant-scoped ResourceAPI request.
    likelyCause: The app or caller omitted the effective tenant headers, or the BFF stripped tenant context before forwarding the request.
    recovery:
      - 'Retry the same /v4/data/resources/<tenant-id>/... request in four modes: path tenant only, tenant header only, X-Tenant-Id only, and both headers'
      - 'Inspect the app BFF or proxy and confirm it forwards both tenant and X-Tenant-Id server-authoritatively for tenant-scoped calls'
      - 'Use eai publicapi get /v4/platform/tenants/<tenant-id>/resource-metadata to confirm the tenant-level public contract'
      - 'Use eai resources storage doctor --tenant-id <tenant-id> --format json after tenant context is fixed'
    nextGate: tenant_context_resolved
  - errorId: EAI_RESOURCEAPI_INSTALL_UNAVAILABLE
    match:
      containsAny:
        - 'RESOURCEAPI_INSTALL_UNAVAILABLE'
        - 'install_registry_no_match'
        - 'RESOURCEAPI_INSTALL_REGISTRY_NO_MATCH'
    meaning: PublicAPI could not resolve a usable ResourceAPI install for the tenant-scoped request.
    likelyCause: Either tenant context was inconsistent across path and headers, or the tenant metadata/schema projection is incomplete for this app.
    recovery:
      - 'Compare /v4/platform/tenants/<tenant-id>/resource-metadata with /v4/data/resources/<tenant-id>/storage before concluding the tenant is unprovisioned'
      - 'If the same /storage request flips between 200 and 503 by header mode, treat it as a tenant-context contract mismatch first'
      - 'Check publishedObjectTypes in tenant resource metadata and treat it as operational state'
      - 'Run eai resources storage doctor --tenant-id <tenant-id> --format json'
      - 'Inspect the app BFF or proxy before escalating to a platform-only fault'
    nextGate: storage_contract_verified
  - errorId: EAI_RESOURCE_SEARCH_EMBEDDING_REQUIRED
    match:
      containsAny:
        - 'resource_search_embedding_required'
        - 'search_embedding_required'
        - 'Search vector embedding endpoint is not configured'
        - 'Configure Azure OpenAI embedding endpoint and deployment before vector or hybrid search'
    meaning: Full-text resource search can be available on the v4 passive ResourceAPI surface while hybrid or vector search is not ready yet.
    likelyCause: The app or agent used the default hybrid v4 passive ResourceAPI search path before storage doctor reported semantic search readiness.
    recovery:
      - 'eai resources storage doctor --tenant-id <tenant-id> --format json'
      - 'If capabilities.search.fulltext is true, retry with eai resources search "<query>" --fulltext --tenant-id <tenant-id>'
      - 'Use --hybrid or --vector only after capabilities.search.hybrid or capabilities.search.vector is true'
      - 'If semantic search is required for the scenario, record a platform capability gap in service-fit-matrix.md'
      - 'Do not apply this fallback to legacy v1/v3 or active ResourceAPI behavior'
    nextGate: resource_search_mode_selected
  - errorId: EAI_WORKFLOW_NOT_READY
    match:
      containsAny:
        - 'workflow readiness failed'
        - 'workflow unavailable'
    meaning: Required workflow support is not yet ready for this repo or tenant.
    likelyCause: Workflow dependencies, package profile, or tenant features are missing.
    recovery:
      - 'eai workflow readiness --format json'
      - 'eai --describe'
      - 'Record blocked workflow capability in service-fit-matrix.md'
    nextGate: workflow_ready
