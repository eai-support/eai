name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Use npm with trusted publishing support
        run: npm install -g npm@11.18.0

      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Public hygiene
        run: npm run security:public-hygiene

      - name: Verify release producer and placeholder policy
        run: |
          npm run verify:managed-deploy-producer:release
          npm run lint:no-placeholder

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Verify committed release-facing docs
        run: |
          node scripts/generate-error-guidance-docs.cjs --check
          node scripts/generate-release-docs.cjs --check

      - name: Verify API reference routes match code
        run: node scripts/verify-api-reference.cjs --check

      - name: Verify committed static registry points at this tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="$TAG_VERSION" node <<'EOF'
          const fs = require('node:fs');
          const expected = process.env.TAG_VERSION;

          function verifyPackument(file, packageName) {
            const packument = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (packument.name !== packageName) {
              throw new Error(`${file} package name ${packument.name ?? 'missing'} does not match ${packageName}`);
            }
            if (packument['dist-tags']?.latest !== expected) {
              throw new Error(`${file} latest ${packument['dist-tags']?.latest ?? 'missing'} does not match ${expected}`);
            }
            if (!packument.versions?.[expected]) {
              throw new Error(`${file} missing version ${expected}`);
            }
          }

          function verifyTarball(file) {
            if (!fs.existsSync(file)) {
              throw new Error(`missing static registry tarball ${file}`);
            }
          }

          verifyPackument('docs-site/static/registry/@enterpriseai/cli', '@enterpriseai/cli');
          verifyPackument('docs-site/static/registry/@enterpriseai%2fcli', '@enterpriseai/cli');
          verifyTarball(`docs-site/static/registry/-/@enterpriseai/cli-${expected}.tgz`);
          EOF

      - name: Create npm tarball
        run: npm pack

      - name: Build eai-cli alias package
        run: node scripts/build-npm-alias-package.cjs

      - name: Create eai-cli alias tarball
        run: npm pack .release/eai-cli-package

      - name: Publish canonical package to npmjs
        run: |
          node scripts/verify-docs-publication.cjs --prepared-source
          VERSION=$(node -p "require('./package.json').version")
          npm publish --access public --provenance "docs-site/static/registry/-/@enterpriseai/cli-${VERSION}.tgz"

      - name: Publish eai-cli alias package to npmjs
        run: npm publish .release/eai-cli-package --access public --provenance

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "${{ github.ref_name }}" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Recommended install:

            ```bash
            npm install -g eai-cli
            ```

            Canonical package:

            ```bash
            npm install -g @enterpriseai/cli
            ```

            Static registry fallback:

            ```bash
            npm install -g @enterpriseai/cli --@enterpriseai:registry=https://eai-support.github.io/eai/registry/
            ```

            See the [full documentation](https://eai-support.github.io/eai) for details.
          files: |
            *.tgz
          make_latest: true


  publish-docs:
    name: Publish qualified release documentation
    needs: release
    uses: ./.github/workflows/docs.yml
    with:
      publish_github_pages: true
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
