name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Validate version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Verify committed release-facing docs
        run: node scripts/generate-release-docs.cjs --check

      - name: Verify API reference routes match code
        run: node scripts/verify-api-reference.cjs --check

      - name: Verify committed static registry points at this tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="$TAG_VERSION" node <<'EOF'
          const fs = require('node:fs');
          const packument = JSON.parse(fs.readFileSync('docs-site/static/registry/@eai-tools/cli', 'utf8'));
          const expected = process.env.TAG_VERSION;
          if (packument['dist-tags']?.latest !== expected) {
            throw new Error(`packument latest ${packument['dist-tags']?.latest ?? 'missing'} does not match ${expected}`);
          }
          if (!packument.versions?.[expected]) {
            throw new Error(`packument missing version ${expected}`);
          }
          EOF

      - name: Create npm tarball
        run: npm pack

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          if [ -z "$PREVIOUS_TAG" ] || [ "$PREVIOUS_TAG" = "${{ github.ref_name }}" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD")
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Configure the scoped EAI registry once per user:

            ```bash
            npm config set @eai-tools:registry https://eai-tools.github.io/eai/registry/ --location=user
            ```

            Install or update the EnterpriseAI CLI:

            ```bash
            npm install -g @eai-tools/cli
            ```

            See the [full documentation](https://eai-tools.github.io/eai) for details.
          files: |
            *.tgz
          make_latest: true

      # ── Notify eai-testing-dev so each release triggers a cross-service smoke ───
      # Fires repository_dispatch(deploy-completed) which routes through the
      # cross-service-e2e.yml matrix (matrix.service=eai-cli) and runs Playwright
      # against services-dev. See:
      #   - docs/ONBOARDING_NEW_VERTICAL.md in eai-testing-dev for the full pattern
      #   - tests/cross-service/eai-cli/ for the spec set this dispatch exercises
      # All GitHub context flows through env: vars, never directly into run:.
      - name: Build deployment-completion payload
        id: dispatch-payload
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          DEPLOY_RUN_URL="https://github.com/${REPO_FULL}/actions/runs/${RUN_ID}"
          PAYLOAD="$(jq -cn \
            --arg repository "eai-cli" \
            --arg service "eai-cli" \
            --arg environment "dev" \
            --arg sha "${SHA}" \
            --arg tag "${TAG}" \
            --arg deployed_at "${DEPLOYED_AT}" \
            --arg deploy_run_url "${DEPLOY_RUN_URL}" \
            '{
              repository: $repository,
              service: $service,
              environment: $environment,
              sha: $sha,
              tag: $tag,
              deployed_at: $deployed_at,
              deploy_run_url: $deploy_run_url
            }')"
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"

      - name: Create eai-testing-dev app token
        id: testing-app-token
        # Soft-fail: if the org secret/app is not yet provisioned for this repo,
        # surface a warning but do not fail the release. Once an org admin adds
        # eai-tools/eai to the EAI_TESTING_APP_PRIVATE_KEY allow-list, the next
        # release lights this up automatically.
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EAI_TESTING_APP_ID }}
          private-key: ${{ secrets.EAI_TESTING_APP_PRIVATE_KEY }}
          owner: enterpriseaigroup
          repositories: |
            eai-testing-dev
          permission-contents: write

      - name: Notify eai-testing-dev of release completion
        if: success() && steps.testing-app-token.outputs.token != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.testing-app-token.outputs.token }}
          repository: enterpriseaigroup/eai-testing-dev
          event-type: deploy-completed
          client-payload: ${{ steps.dispatch-payload.outputs.payload }}

      - name: Warn if cross-service notify was skipped
        if: steps.testing-app-token.outputs.token == ''
        run: |
          echo "::warning::eai-testing-dev cross-service smoke was NOT triggered for this release."
          echo "::warning::Ask an org admin to add eai-tools/eai to the EAI_TESTING_APP_PRIVATE_KEY allow-list,"
          echo "::warning::or verify EAI_TESTING_APP_ID is exposed to this repository."
