name: Docs Pull Request Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".tech-docs/**"
      - "docs-site/**"
      - "scripts/generate-release-docs.cjs"
      - "scripts/generate-registry.cjs"
      - "scripts/generate-llms-full.cjs"
      - "scripts/generate-docs-experience-assets.cjs"
      - "scripts/verify-docs-experience-assets.cjs"
      - ".github/workflows/docs-preview.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Docs Preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Verify generated documentation experience assets
        run: |
          npm run docs:experience-assets:check
          npm run docs:experience-assets:verify

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Build Docusaurus docs site
        env:
          EAI_DOCS_BASE_URL: /eai/
        run: cd docs-site && npm run build

      - name: Verify preview artifact
        run: |
          test -f docs-site/build/index.html
          test -f docs-site/build/docs/start-here.html
          test -f docs-site/build/docs-search-index.json
          test -f docs-site/build/docs-capabilities.json

      - name: Deploy Azure Static Web Apps preview
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EAI_DEV }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: docs-site/build
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Publish preview link
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        with:
          script: |
            const marker = '<!-- eai-docs-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            if (!previewUrl) {
              core.setFailed('Azure Static Web Apps did not return a preview URL.');
              return;
            }

            const body = `${marker}\n## Docs preview\n\n[Open the pull request preview](${previewUrl}/eai/)`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  close-preview:
    name: Close Docs Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Close Azure Static Web Apps preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EAI_DEV }}
          action: close
