name: Docs Pull Request Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".tech-docs/**"
      - "docs-site/**"
      - "scripts/generate-release-docs.cjs"
      - "scripts/generate-registry.cjs"
      - "scripts/generate-llms-full.cjs"
      - "scripts/generate-docs-experience-assets.cjs"
      - "scripts/verify-docs-experience-assets.cjs"
      - ".github/workflows/docs-preview.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: docs-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Docs Preview
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Verify generated documentation experience assets
        run: |
          npm run docs:experience-assets:check
          npm run docs:experience-assets:verify

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Build Docusaurus docs site
        env:
          EAI_DOCS_BASE_URL: /
        run: cd docs-site && npm run build

      - name: Verify preview artifact
        run: |
          test -f docs-site/build/index.html
          test -f docs-site/build/docs/start-here.html
          test -f docs-site/build/docs-search-index.json
          test -f docs-site/build/docs-capabilities.json

      - name: Deploy Azure Static Web Apps preview
        id: deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EAI_DEV }}
          PREVIEW_ENVIRONMENT: docs${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          npx --yes @azure/static-web-apps-cli@2.0.10 deploy docs-site/build \
            --env "$PREVIEW_ENVIRONMENT" \
            --no-use-keychain 2>&1 | tee "$RUNNER_TEMP/swa-deploy.log"

          preview_url="$(grep -Eo 'https://[^[:space:]]+\.azurestaticapps\.net' "$RUNNER_TEMP/swa-deploy.log" | tail -n 1)"
          if [ -z "$preview_url" ]; then
            echo "Azure Static Web Apps did not return a preview URL." >&2
            exit 1
          fi
          echo "static_web_app_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Publish preview link
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.static_web_app_url }}
        with:
          script: |
            const marker = '<!-- eai-docs-preview -->';
            const previewUrl = process.env.PREVIEW_URL;
            if (!previewUrl) {
              core.setFailed('Azure Static Web Apps did not return a preview URL.');
              return;
            }

            const body = `${marker}\n## Docs preview\n\n[Open the pull request preview](${previewUrl}/)`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  close-preview:
    name: Close Docs Preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create disposable deployment directory
        run: mkdir preview-close

      - name: Close Azure Static Web Apps preview
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_EAI_DEV }}
          PREVIEW_ENVIRONMENT: docs${{ github.event.pull_request.number }}
          INPUT_REPO_TOKEN: ${{ github.token }}
        run: |
          # The CLI bootstraps the same Azure deployment client used by the official action.
          # Its dry-run mode does not close named environments, so invoke that client with
          # the pull-request event context GitHub provides to this closed pull request.
          npx --yes @azure/static-web-apps-cli@2.0.10 deploy preview-close \
            --env "$PREVIEW_ENVIRONMENT" \
            --dry-run \
            --no-use-keychain

          deployment_client="$(find "$HOME/.swa/deploy" -type f -name StaticSitesClient -print -quit)"
          if [ -z "$deployment_client" ]; then
            echo "Azure Static Web Apps deployment client was not installed." >&2
            exit 1
          fi

          INPUT_ACTION=close \
          INPUT_AZURE_STATIC_WEB_APPS_API_TOKEN="$SWA_CLI_DEPLOYMENT_TOKEN" \
          INPUT_APP_LOCATION=preview-close \
          INPUT_OUTPUT_LOCATION="" \
          INPUT_SKIP_APP_BUILD=true \
          INPUT_SKIP_API_BUILD=true \
          INPUT_DEPLOYMENT_ENVIRONMENT="$PREVIEW_ENVIRONMENT" \
          "$deployment_client"
