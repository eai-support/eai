name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - ".tech-docs/**"
      - "docs-site/**"
      - "scripts/generate-release-docs.cjs"
      - "scripts/generate-registry.cjs"
      - "scripts/generate-llms-full.cjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Build Docusaurus docs site
        run: cd docs-site && npm run build

      - name: Verify generated site
        run: |
          REQUIRED_FILES=(
            "docs-site/build/index.html"
            "docs-site/build/docs/overview.html"
            "docs-site/build/registry/index.html"
            "docs-site/build/llms.txt"
            "docs-site/build/llms-full.txt"
            "docs-site/build/cli-help.txt"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file $file is missing!"
              exit 1
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
