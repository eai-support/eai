name: Deploy Docs

on:
  pull_request:
    branches: [main]
    paths:
      - ".tech-docs/**"
      - "docs-site/**"
      - "scripts/generate-release-docs.cjs"
      - "scripts/generate-registry.cjs"
      - "scripts/generate-llms-full.cjs"
      - "scripts/generate-docs-experience-assets.cjs"
      - "scripts/verify-docs-experience-assets.cjs"
  push:
    branches: [main]
    paths:
      - ".tech-docs/**"
      - "docs-site/**"
      - "scripts/generate-release-docs.cjs"
      - "scripts/generate-registry.cjs"
      - "scripts/generate-llms-full.cjs"
      - "scripts/generate-docs-experience-assets.cjs"
      - "scripts/verify-docs-experience-assets.cjs"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Verify generated documentation experience assets
        run: |
          npm run docs:experience-assets:check
          npm run docs:experience-assets:verify

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Build Docusaurus docs site
        run: cd docs-site && npm run build

      - name: Verify required public assets
        run: |
          test -f docs-site/build/index.html
          test -f docs-site/build/docs/start-here.html
          test -f docs-site/build/docs/api-reference.html
          test -f docs-site/build/docs-search-index.json
          test -f docs-site/build/docs-capabilities.json

  deploy:
    name: Build & Deploy Docs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Verify documentation experience assets
        run: |
          npm run docs:experience-assets:check
          npm run docs:experience-assets:verify

      - name: Build Docusaurus docs site
        run: cd docs-site && npm run build

      - name: Verify generated site
        run: |
          REQUIRED_FILES=(
            "docs-site/build/index.html"
            "docs-site/build/docs/start-here.html"
            "docs-site/build/registry/index.html"
            "docs-site/build/llms.txt"
            "docs-site/build/llms-full.txt"
            "docs-site/build/cli-help.txt"
            "docs-site/build/docs-search-index.json"
            "docs-site/build/docs-capabilities.json"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Required file $file is missing!"
              exit 1
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Mint website docs PR token
        id: website-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.EAI_WEBSITE_DOCS_APP_ID || vars.EAI_DEPLOY_APP_ID || vars.EAI_TESTING_APP_ID }}
          private-key: ${{ secrets.EAI_WEBSITE_DOCS_APP_PRIVATE_KEY || secrets.EAI_DEPLOY_APP_PRIVATE_KEY || secrets.EAI_TESTING_APP_PRIVATE_KEY }}
          owner: EAI-Website
          repositories: |
            com.enterpriseaigroup
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout enterpriseaigroup.com website
        if: steps.website-token.outcome == 'success' && steps.website-token.outputs.token != ''
        uses: actions/checkout@v7
        with:
          repository: EAI-Website/com.enterpriseaigroup
          token: ${{ steps.website-token.outputs.token }}
          path: website

      - name: Build website-hosted Docusaurus copy
        if: steps.website-token.outcome == 'success' && steps.website-token.outputs.token != ''
        env:
          # Hosted Docs must call the website API on the same origin. This avoids
          # a separate CORS and environment-endpoint deployment dependency.
          EAI_DOCS_ASSISTANT_API_URL: /api/chat
          EAI_DOCS_SITE_URL: https://www.enterpriseaigroup.com
          EAI_DOCS_BASE_URL: /docs/eai/
        run: cd docs-site && npm run build

      - name: Verify hosted Docs use the same-origin assistant API
        if: steps.website-token.outcome == 'success' && steps.website-token.outputs.token != ''
        run: |
          if ! rg --fixed-strings --quiet '/api/chat' docs-site/build; then
            echo "Hosted Docs did not include the same-origin assistant endpoint." >&2
            exit 1
          fi

      - name: Sync generated EAI docs into website repo
        if: steps.website-token.outcome == 'success' && steps.website-token.outputs.token != ''
        run: |
          rm -rf website/public/docs/eai
          mkdir -p website/public/docs/eai
          cp -R docs-site/build/. website/public/docs/eai/

      - name: Create website EAI docs sync PR
        if: steps.website-token.outcome == 'success' && steps.website-token.outputs.token != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.website-token.outputs.token }}
          path: website
          branch: codex/sync-eai-docs
          delete-branch: true
          commit-message: "docs: sync EAI documentation site"
          title: "docs: sync EAI documentation site"
          body: |
            Syncs the generated EAI Docusaurus documentation site into `public/docs/eai`
            for hosting at `https://www.enterpriseaigroup.com/docs/eai/`.

            Source deployment: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            Source commit: `${{ github.sha }}`

            The source of truth remains `eai-support/eai`; this PR only updates the
            website-hosted static copy.
          labels: |
            documentation
            automation

      - name: Warn when website docs sync was skipped
        if: steps.website-token.outcome != 'success' || steps.website-token.outputs.token == ''
        run: |
          echo "::warning::Skipped enterpriseaigroup.com docs sync because the website GitHub App token is not configured or could not be minted."
