name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CLI Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # Windows (NTFS) cannot materialize files whose names contain `:`.
      # The Gofer resource bundle ships namespaced files like
      # `resources/gofer/claude-commands/gofer:plan.md`, which causes
      # `actions/checkout` to abort with `invalid path` on windows-latest.
      # These paths are not exercised by the CLI build/lint/typecheck/test,
      # so we skip them via sparse-checkout on Windows only.
      - name: Checkout repository
        if: runner.os != 'Windows'
        uses: actions/checkout@v6

      - name: Checkout repository (Windows — skip NTFS-illegal paths)
        if: runner.os == 'Windows'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !resources/gofer/claude-commands/gofer:*
            !resources/gofer/copilot-prompts/gofer:*
            !gofer/extension/resources/claude-commands/gofer:*
            !gofer/extension/resources/copilot-prompts/gofer:*
            !gofer/.agents/skills/gofer:*
            !gofer/.github/prompts/gofer:*
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test
