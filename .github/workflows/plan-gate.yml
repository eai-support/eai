# plan-before-code gate. Canonical copy: enterpriseaigroup/eai-stack
# .claude/skills/plan-before-code/references/plan-gate.yml — edit there, then copy.
# Advisory (warnings only) until the repo variable PLAN_GATE_ENFORCE is "true".
# Before enforcing, protect .github/workflows/ (CODEOWNERS review or an org ruleset):
# a pull_request workflow runs from the PR's own copy, so an unprotected PR could edit it.
# Structure-only: the full section check is check_plan.py, run by the planning agent.
name: plan-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  plan-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PR body Plan line
        env:
          # Passed via env, never interpolated into the script: the PR body is untrusted.
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          ENFORCE: ${{ vars.PLAN_GATE_ENFORCE }}
        run: |
          fail() {
            if [ "$ENFORCE" = "true" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 (advisory: set repo variable PLAN_GATE_ENFORCE=true to enforce)"; exit 0
          }
          case "$HEAD_REF" in
            hotfix/*|release/*|backmerge/*|dependabot/*|renovate/*) echo "Exempt branch $HEAD_REF"; exit 0 ;;
          esac
          # First Plan line with a value; an empty template placeholder must not shadow a filled one.
          value=$(printf '%s\n' "$BODY" | tr -d '\r' | sed -E 's/<!--.*-->//g' \
            | grep -iE '^\**plan\**:' \
            | sed -E 's/^\**[Pp][Ll][Aa][Nn]\**:\**[[:space:]]*//; s/[`<>]//g; s/[[:space:]]+$//' \
            | grep -m1 . || true)
          [ -n "$value" ] || fail "PR body needs 'Plan: <plan path or GitHub URL>' or 'Plan: exempt — <reason>'. See the plan-before-code skill."
          if printf '%s' "$value" | grep -qiE '^exempt([[:space:]]|$)|^exempt(—|–|-|:)'; then
            printf '%s' "$value" | grep -qiE '^exempt([[:space:]]*(—|–|:)|[[:space:]]+-)[[:space:]]*[^[:space:]]' \
              && { echo "Plan exemption: $value"; exit 0; }
            fail "Plan exemption needs a reason: 'Plan: exempt — <reason>'."
          fi
          PLAN_PATH='\.specify(-pro)?/specs/[A-Za-z0-9_][A-Za-z0-9._-]*/plan\.md'
          ORGS='enterpriseaigroup|EAI-Website|eai-support|eai-tools|EAI-verticals|eai-connectors|eai-generated-apps'
          if printf '%s' "$value" | grep -qE '^https?://'; then
            printf '%s' "$value" | grep -qE "^https://github\.com/($ORGS)/[A-Za-z0-9._-]+/blob/[^[:space:]]+/${PLAN_PATH}$" \
              || fail "Plan URL must be a GitHub link to a plan in an EAI org: https://github.com/<org>/<repo>/blob/<ref>/.specify[-pro]/specs/<feature>/plan.md"
            echo "Plan linked: $value (approvals are reviewed in that repo's PR)"; exit 0
          fi
          printf '%s' "$value" | grep -qE "^${PLAN_PATH}$" \
            || fail "Plan path must be .specify-pro/specs/<feature>/plan.md or .specify/specs/<feature>/plan.md (got '$value')."
          { [ -f "$value" ] && [ ! -L "$value" ]; } || fail "Plan file '$value' not found in this PR."
          approvals=$(sed -n '/^## 14\./,$p' "$value")
          for role in Product CEO; do
            printf '%s\n' "$approvals" | grep -qE "^[[:space:]]*-[[:space:]]*${role}:[[:space:]]*[^[:space:]<].*[0-9]{4}-[0-9]{2}-[0-9]{2}" \
              || fail "$value: missing dated ${role} approval in §14 (format: '- ${role}: Name, YYYY-MM-DD')."
          done
          echo "Plan approved: $value"
