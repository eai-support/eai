name: Feature request
description: Suggest an improvement to the EAI CLI.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Please keep examples public-safe.
        Paste commands, sanitized logs, and examples directly into this form. Do not attach ZIPs, scripts, installers, binaries, or fix archives; unsolicited executable/archive attachments may be removed by maintainers.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the CLI do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Do not include secrets, tenant data, customer data, private URLs, ZIPs, scripts, installers, binaries, or fix archives.
    validations:
      required: false
