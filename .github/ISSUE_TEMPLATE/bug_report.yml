name: Bug report
description: Report a reproducible problem with the EAI CLI.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, tenant data, customer data, private URLs, or local `.env` files.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output from `eai --version`.
      placeholder: "2.9.5"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output from `node --version`.
      placeholder: "v24.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command and flags that triggered the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, tenant IDs, customer data, and private URLs before pasting.
      render: text
    validations:
      required: false
