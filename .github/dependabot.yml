version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: production
        exclude-patterns:
          - "inquirer"
      npm-production-interactive:
        patterns:
          - "inquirer"
      npm-development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /docs-site
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      docs-site:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
